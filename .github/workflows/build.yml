name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UniFiDnsManager.csproj

      - name: Build
        run: dotnet build UniFiDnsManager.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows build
        run: >-
          dotnet publish UniFiDnsManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:PublishTrimmed=false
          --output artifact

      - name: Run Windows self-test
        shell: pwsh
        run: |
          $report = Join-Path $PWD "self-test.json"
          $arguments = @("--self-test", ('--self-test-output="{0}"' -f $report))
          $process = Start-Process -FilePath "./artifact/UniFi-Network-Manager.exe" -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) {
            throw "Windows self-test failed."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: UniFi-Network-Manager-win-x64
          path: artifact/**
          if-no-files-found: error
